services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - hireflow_data:/app/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  hireflow_data:
